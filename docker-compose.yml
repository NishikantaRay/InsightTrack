services:
  db:
    image: postgres:15-alpine
    environment:
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_DB: ${POSTGRES_DB}
    # Bound to loopback: the backend reaches Postgres over the compose network,
    # so this is only for local psql/debugging and must not be exposed to the
    # host's network interfaces.
    ports:
      - "127.0.0.1:5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER} -d ${POSTGRES_DB}"]
      interval: 5s
      timeout: 5s
      retries: 10

  backend:
    build: ./apps/analytics-api
    environment:
      PG_HOST: db
      PG_PORT: 5432
      PG_USER: ${POSTGRES_USER}
      PG_PASSWORD: ${POSTGRES_PASSWORD}
      PG_DATABASE: ${POSTGRES_DB}
      PORT: 3001
      JWT_SECRET: ${JWT_SECRET}
      CORS_ORIGINS: ${CORS_ORIGINS}
      DUCKDB_PATH: duckdb/analytics.duckdb
      SYNC_INTERVAL_MS: ${SYNC_INTERVAL_MS:-60000}
      SYNC_BATCH_SIZE: ${SYNC_BATCH_SIZE:-5000}
      ANTHROPIC_API_KEY: ${ANTHROPIC_API_KEY:-}
      OPENAI_API_KEY: ${OPENAI_API_KEY:-}
      ANTHROPIC_BASE_URL: ${ANTHROPIC_BASE_URL:-}
      # S3 / R2 cold storage (optional)
      S3_BUCKET: ${S3_BUCKET:-}
      S3_ACCESS_KEY: ${S3_ACCESS_KEY:-}
      S3_SECRET_KEY: ${S3_SECRET_KEY:-}
      S3_ENDPOINT: ${S3_ENDPOINT:-}
      S3_REGION: ${S3_REGION:-us-east-1}
      S3_PREFIX: ${S3_PREFIX:-insighttrack}
      S3_USE_SSL: ${S3_USE_SSL:-true}
      ARCHIVE_DAYS: ${ARCHIVE_DAYS:-30}
      ARCHIVE_TABLES: ${ARCHIVE_TABLES:-events,sessions}
    extra_hosts:
      - "host.docker.internal:host-gateway"
    ports:
      - "3001:3001"
    volumes:
      - duckdb_data:/app/duckdb
    depends_on:
      db:
        condition: service_healthy

  ui:
    build: ./apps/dashboard-web
    environment:
      VITE_API_URL: http://backend:3001
    ports:
      - "4173:4173"
    depends_on:
      - backend

  demo-site:
    build: ./examples/demo-site
    ports:
      - "8080:80"
    depends_on:
      - backend

  pgadmin:
    image: dpage/pgadmin4:latest
    environment:
      PGADMIN_DEFAULT_EMAIL: ${PGADMIN_DEFAULT_EMAIL}
      PGADMIN_DEFAULT_PASSWORD: ${PGADMIN_DEFAULT_PASSWORD}
      PGADMIN_LISTEN_PORT: 5050
    # Loopback only. This is a full database console guarded by a password from
    # .env; it should never be reachable from outside the host.
    ports:
      - "127.0.0.1:5050:5050"
    depends_on:
      db:
        condition: service_healthy

volumes:
  pgdata:
  duckdb_data:
