    <!-- ── Search engine verification (paste your codes, then submit sitemap) ──

    <!-- ── Primary SEO ─────────────────────────────────────────────────────── -->
    <title>InsightsTrack — Self-Hosted, Privacy-First Analytics</title>
    <meta name="description"
        content="InsightsTrack is an open-source, self-hosted web analytics platform — the privacy-first alternative to Google Analytics. Track visitors, pageviews, conversions, heatmaps, and Core Web Vitals with no cookies and no data selling. Deploy in 15 minutes." />
    <meta name="keywords"
        content="web analytics, open source analytics, self-hosted analytics, google analytics alternative, privacy analytics, cookieless analytics, GDPR analytics, heatmaps, conversion funnels, core web vitals, plausible alternative" />
    <meta name="author" content="Nishikanta Ray" />
    <meta name="robots" content="index, follow, max-image-preview:large" />
    <link rel="canonical" href="https://insightstrack.dev/" />
    <meta name="theme-color" content="#6366f1" />

    <!-- ── AEO (Answer Engine Optimization) ────────────────────────────────────
         Advertise the Markdown twin so AI agents (ChatGPT/GPTBot, Claude,
         Perplexity, Gemini, Google AI Overviews) can fetch a clean, citeable
         copy. The authoritative Link: rel="alternate" HTTP header is emitted at
         the edge by @dualmark/cloudflare; this <link> is the static fallback. -->
    <link rel="alternate" type="text/markdown" href="https://insightstrack.dev/index.md" />

    <!-- RSS feed for the blog (readers, aggregators, AI crawlers). -->
    <link rel="alternate" type="application/rss+xml" title="InsightsTrack Blog" href="https://insightstrack.dev/feed.xml" />

    <!-- ── Open Graph (Facebook, LinkedIn, Slack…) ─────────────────────────── -->
    <meta property="og:type" content="website" />
    <meta property="og:site_name" content="InsightsTrack" />
    <meta property="og:locale" content="en_US" />
    <meta property="og:title" content="InsightsTrack — Self-Hosted, Privacy-First Web Analytics" />

        content="The open-source alternative to Google Analytics. Track visitors, heatmaps, funnels, and Web Vitals on your own server — no cookies, no consent banners, free forever." />

    <meta property="og:image" content="https://insightstrack.dev/og-image.png" />
    <meta property="og:image:width" content="1200" />
    <meta property="og:image:height" content="630" />
